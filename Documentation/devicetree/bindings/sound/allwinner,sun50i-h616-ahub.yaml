%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/allwinner,sun50i-h616-ahub.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner H616 Audio Hub

maintainers:
  - Jernej Skrabec <jernej.skrabec@gmail.com>

description:
  The audio hub is a crossbar switch connecting three APBIF DMA interfaces,
  two digital audio mixers and four I2S/PCM controllers. Three of the I2S
  controllers are routed to pins, the second one is wired to the HDMI
  controller.

properties:
  "#sound-dai-cells":
    description:
      The cell contains the index of the I2S/PCM controller, 0 to 3.
    const: 1

  compatible:
    const: allwinner,sun50i-h616-ahub

  reg:
    maxItems: 1

  clocks:
    items:
      - description: Bus Clock
      - description: Module Clock

  clock-names:
    items:
      - const: bus
      - const: mod

  resets:
    maxItems: 1

  dmas:
    items:
      - description: APBIF 0 TX DMA Channel
      - description: APBIF 0 RX DMA Channel
      - description: APBIF 1 TX DMA Channel
      - description: APBIF 1 RX DMA Channel
      - description: APBIF 2 TX DMA Channel
      - description: APBIF 2 RX DMA Channel

  dma-names:
    items:
      - const: tx0
      - const: rx0
      - const: tx1
      - const: rx1
      - const: tx2
      - const: rx2

required:
  - "#sound-dai-cells"
  - compatible
  - reg
  - clocks
  - clock-names
  - resets
  - dmas
  - dma-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/sun50i-h616-ccu.h>
    #include <dt-bindings/reset/sun50i-h616-ccu.h>

    audio-hub@5097000 {
        compatible = "allwinner,sun50i-h616-ahub";
        reg = <0x05097000 0xb00>;
        clocks = <&ccu CLK_BUS_AUDIO_HUB>, <&ccu CLK_AUDIO_HUB>;
        clock-names = "bus", "mod";
        resets = <&ccu RST_BUS_AUDIO_HUB>;
        dmas = <&dma 3>, <&dma 3>, <&dma 4>, <&dma 4>, <&dma 5>, <&dma 5>;
        dma-names = "tx0", "rx0", "tx1", "rx1", "tx2", "rx2";
        #sound-dai-cells = <1>;
    };

...
