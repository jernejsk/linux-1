%YAML 1.2
---
$id: http://devicetree.org/schemas/net/bluetooth/aicsemi,aic8800d80-bt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: AICSemi AIC8800D80 Bluetooth controller

maintainers:
  - Jernej Skrabec <jernej.skrabec@gmail.com>

description:
  The Bluetooth controller of the AIC8800D80 is attached over a serial port and
  shares its firmware with the wireless part of the same package, which is
  attached over SDIO and described in a separate binding.  The wireless driver
  loads that firmware, so the controller only answers once the wireless side
  came up.

allOf:
  - $ref: bluetooth-controller.yaml#

properties:
  compatible:
    const: aicsemi,aic8800d80-bt

  reset-gpios:
    maxItems: 1
    description: Line holding the Bluetooth part of the device in reset.

  device-wakeup-gpios:
    maxItems: 1
    description: Line the host drives to keep the controller awake.

  host-wakeup-gpios:
    maxItems: 1
    description: Line the controller drives to wake the host.

  vddio-supply:
    description: Supply for the serial port pins of the device.

  max-speed:
    default: 1500000

required:
  - compatible

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    serial {
        bluetooth {
            compatible = "aicsemi,aic8800d80-bt";
            reset-gpios = <&pio 1 2 GPIO_ACTIVE_LOW>;
            device-wakeup-gpios = <&pio 1 3 GPIO_ACTIVE_HIGH>;
            host-wakeup-gpios = <&pio 1 4 GPIO_ACTIVE_HIGH>;
            vddio-supply = <&reg_bldo1>;
            max-speed = <1500000>;
        };
    };
