%YAML 1.2
---
$id: http://devicetree.org/schemas/net/wireless/xradio,xr819.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: XRadio XR819 SDIO WiFi

maintainers:
  - Jernej Skrabec <jernej.skrabec@gmail.com>

description: >
  The XR819 is an 802.11b/g/n SDIO WiFi chip. It is a derivative of the
  ST-Ericsson CW1200 and is driven by the same driver.

  The SDIO vendor and device IDs are enough to bind the driver, so the node is
  only needed to describe the out-of-band host wake interrupt or to supply a
  MAC address.

  The chip's reset line and its 32.768 kHz clock should be described with an
  mmc-pwrseq on the SDIO host above it, see
  Documentation/devicetree/bindings/mmc/mmc-pwrseq-simple.yaml.

allOf:
  - $ref: ieee80211.yaml#

properties:
  compatible:
    const: xradio,xr819

  reg:
    description: SDIO function number
    maxItems: 1

  interrupts:
    description: >
      The out-of-band host wake line. When absent, the in-band interrupt
      provided by the SDIO bus is used instead.
    maxItems: 1

  interrupt-names:
    const: host-wake

  local-mac-address: true
  mac-address: true

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    mmc {
        #address-cells = <1>;
        #size-cells = <0>;

        wifi@1 {
            compatible = "xradio,xr819";
            reg = <1>;
            interrupt-parent = <&pio>;
            interrupts = <6 15 IRQ_TYPE_LEVEL_HIGH>;
            interrupt-names = "host-wake";
        };
    };
