%YAML 1.2
---
$id: http://devicetree.org/schemas/net/wireless/sprd,uwe5622.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unisoc UWE5622 Wi-Fi and Bluetooth controller

maintainers:
  - Jernej Skrabec <jernej.skrabec@gmail.com>

description: |
  The UWE5622 is a combined dual-band 802.11ac and Bluetooth 5 controller.
  Wi-Fi, Bluetooth HCI, firmware control, and power-management messages share
  one multiplexed SDIO function. Boards normally control reset and the 32 kHz
  low-power clock through the parent MMC power sequence.

allOf:
  - $ref: /schemas/net/wireless/wireless-controller.yaml#

properties:
  compatible:
    const: sprd,uwe5622

  reg:
    const: 1

  interrupts:
    minItems: 1
    maxItems: 2
    description:
      Optional out-of-band wake interrupts from the controller. The interrupt
      trigger describes the active polarity of the selected controller output.
      Rising-edge and high-level interrupts select active high; falling-edge
      and low-level interrupts select active low. If they are absent, the SDIO
      in-band interrupt is used for wakeup.

  interrupt-names:
    minItems: 1
    items:
      - enum:
          - bt-host-wake
          - wlan-host-wake
      - enum:
          - bt-host-wake
          - wlan-host-wake
    description:
      Names the controller wake outputs connected to the host. Wake events
      from a radio function are routed to its named output, or to the single
      connected output when only one is wired up.

  sprd,host-wake-duration-ms:
    description:
      Time for which the firmware holds the selected host-wake output active.
    minimum: 10
    maximum: 310
    multipleOf: 10
    default: 20

  bluetooth-enable-gpios:
    maxItems: 1
    description:
      Bluetooth reset/regulator-enable signal. The signal is asserted while
      the HCI device is open and forced inactive during shutdown.

  device-wake-gpios:
    maxItems: 1
    description:
      Optional host-to-controller Bluetooth wake signal.

  wakeup-source: true

required:
  - compatible
  - reg

dependencies:
  interrupts:
    - interrupt-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    mmc {
        #address-cells = <1>;
        #size-cells = <0>;
        bus-width = <4>;
        non-removable;
        keep-power-in-suspend;

        wifi@1 {
            compatible = "sprd,uwe5622";
            reg = <1>;
            interrupt-parent = <&gpio>;
            interrupts = <4 IRQ_TYPE_EDGE_RISING>;
            interrupt-names = "bt-host-wake";
            bluetooth-enable-gpios = <&gpio 4 4 GPIO_ACTIVE_HIGH>;
            device-wake-gpios = <&gpio 4 2 GPIO_ACTIVE_HIGH>;
            wakeup-source;
        };
    };
